<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>說走就走－出發吧</title>
<meta name="description" content="路過找吃、給一個地點就排出吃喝玩行程">
<meta name="theme-color" content="#f3f1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出發吧">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f1ec;--card:#ffffff;--line:#e4dfd6;--line2:#eeeae3;--ink:#3c3f3d;--ink2:#4a4d49;--mute:#5d605b;--faint:#8a8d88;
  --sage:#42605a;--sage-d:#2f4742;--sage-l:#e7efec;
  --blue:#4f6a82;--blue-d:#3c566d;--blue-l:#e3eaf1;
  --terra:#9a6a53;--terra-d:#6e3f2c;--terra-l:#f4e7e0;
  --amber-l:#f6ecd2;--amber:#5a430c;--amber2:#6e5210;
  --ok-l:#e3efe6;--ok:#2a5c43;--bad:#8a4a33;
  --drink-l:#efe8d8;--drink:#7a6330;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',-apple-system,'PingFang TC',sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:var(--sage);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
header.top{display:flex;align-items:center;gap:4px;padding:calc(12px + env(safe-area-inset-top)) 12px 8px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
header.top h1{margin:0;font-size:21px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--ink);border-radius:12px}
.hbtn{min-height:44px;padding:0 10px;border:none;background:transparent;font-size:15px;font-weight:700;color:var(--sage);display:flex;align-items:center}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.btn{width:100%;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:16px;background:var(--sage);color:#fff;font-size:18px;font-weight:700;padding:0 16px;text-align:center}
.btn.blue{background:var(--blue)}.btn.terra{background:var(--terra)}
.btn:disabled{background:#c9c5bc;color:#fff}
.btn2{min-height:48px;display:flex;align-items:center;justify-content:center;border:1.5px solid #cdd9d5;border-radius:14px;background:#fff;font-size:16px;font-weight:700;color:var(--sage);padding:0 14px;text-align:center}
.link{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--sage);background:none;border:none}
.foot{padding:12px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;position:sticky;bottom:0;background:linear-gradient(to bottom,rgba(243,241,236,0),var(--bg) 18px)}
.hint{font-size:13px;line-height:1.55;color:var(--mute)}
.lbl{font-size:16px;font-weight:700;margin:0}
.sub{font-size:14px;color:var(--mute)}
h2.sec{margin:8px 0 0;font-size:16px;font-weight:700}
.field{display:flex;flex-direction:column;gap:8px}
.inp{height:52px;padding:0 14px;border:1.5px solid #cfd8e0;border-radius:12px;background:#fff;font-size:16px;width:100%}
textarea.inp{height:auto;min-height:180px;padding:12px 14px;font-size:14px;line-height:1.5;font-family:ui-monospace,Menlo,monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1.5px solid #d6d1c7;border-radius:999px;background:#fff;font-size:15px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-l);color:var(--sage);font-weight:700}
.chip.blue[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.chip.terra[aria-pressed="true"]{border-color:var(--terra);background:var(--terra-l);color:var(--terra-d)}
.seg{display:grid;gap:8px}
.seg button{height:48px;border:1.5px solid #d6d1c7;border-radius:12px;background:#fff;font-size:15px}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue);font-weight:700}
.note{padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.6}
.note.amber{background:var(--amber-l);color:var(--amber2)}.note.amber b{color:var(--amber)}
.note.ok{background:var(--ok-l);color:var(--ok)}
.note.terra{background:var(--terra-l);color:var(--terra-d)}
.note.blue{background:var(--blue-l);color:var(--blue-d)}
.steps{display:flex;gap:6px;font-size:13px;padding:4px 16px 12px;align-items:center}
.steps span{padding:4px 10px;border-radius:999px;color:var(--blue)}
.steps span.on{background:var(--blue);color:#fff;font-weight:700}
.steps span.done{background:var(--blue-l)}
.tag{padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.t-eat{background:var(--terra-l);color:#8a5a44}.t-drink{background:var(--drink-l);color:var(--drink)}.t-play{background:var(--sage-l);color:var(--sage)}.t-stay{background:var(--blue-l);color:var(--blue)}.t-go{background:#ecebe6;color:var(--mute)}
.stop{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.stop .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stop .name{font-size:18px;font-weight:700;word-break:break-word}
.status{font-size:14px;font-weight:700}
.s-open{color:var(--ok)}.s-unk{color:var(--amber2)}.s-closed{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{min-height:40px;padding:0 12px;border:1.5px solid #cdd9d5;border-radius:10px;background:#fff;font-size:14px;font-weight:700;color:var(--sage);display:flex;align-items:center}
.park{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--blue-l);border-radius:12px}
.pbadge{width:28px;height:28px;flex-shrink:0;border-radius:7px;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.park span.t{flex:1;font-size:14px;color:var(--blue-d);line-height:1.45}
.park a{font-size:14px;font-weight:700;color:var(--blue);min-height:36px;display:flex;align-items:center}
.timecol{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start}
.timecol .tm{font-size:16px;font-weight:700;padding-top:14px;text-align:right;color:var(--ink2)}
.leg{margin-left:64px;padding:10px 12px;border-left:3px dashed #b9c6d3;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--blue-d)}
.leg b{color:var(--blue)}
.tabs{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto}
.tabs button{min-height:44px;padding:0 14px;border:1.5px solid #d6d1c7;border-radius:12px;background:#fff;white-space:nowrap;font-size:15px}
.tabs button[aria-selected="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue);font-weight:700}
.bigcard{display:flex;align-items:center;gap:16px;padding:20px;background:#fff;border-radius:20px;border:1px solid var(--line);color:var(--ink);text-align:left;width:100%}
.bigcard .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bigcard b{font-size:19px;display:block}
.bigcard span.d{font-size:14px;color:var(--mute)}
.list .rowitem{min-height:60px;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2);color:var(--ink)}
.list .rowitem:last-child{border-bottom:none}
.sheet-bg{position:fixed;inset:0;background:rgba(40,42,40,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:3px;background:#cfcac0;margin:6px auto 10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2f3331;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;z-index:40;max-width:88vw;text-align:center}
.mealrow{display:grid;grid-template-columns:auto 1fr 110px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.mealrow:last-child{border-bottom:none}
.mealrow input[type=time]{height:44px;border:1.5px solid #cfd8e0;border-radius:10px;padding:0 8px;background:#fff;width:100%}
.mealrow select{height:44px;border:1.5px solid #cfd8e0;border-radius:10px;background:#fff;padding:0 6px}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--sage)}
.cur{border:2px solid var(--blue)}
.done-row{font-size:14px;color:var(--mute);padding:4px 16px}
.hide{display:none!important}
@media (prefers-color-scheme: dark){ /* app stays light: map-style outdoor use reads better in light */ }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<script>
'use strict';
/* 揪團後端（Google Apps Script 網頁應用程式網址），部署後貼在這裡 */
const API_URL = 'https://script.google.com/macros/s/AKfycbziZY2SgwGr_hPJO06DJa5Ua2WN8eCgv5ssjzHcxN4WCvOu3LCaGr6o0ueXQPmE_7rs/exec';
/* ================= storage ================= */
// 這幾樣登入後會自動存到雲端（group.js 的 onLocalChange）
const SYNC_WATCH = {trips:'trip', pocket:'pocket', prefs:1, meals:1, session:1};
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('lg.'+k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ const old = (k in SYNC_WATCH)? this.get(k, null) : undefined;
    try{ localStorage.setItem('lg.'+k, JSON.stringify(v)); }catch(e){ toast('手機空間不足或瀏覽器擋住儲存'); return false; }
    if(k in SYNC_WATCH && typeof onLocalChange==='function') onLocalChange(k, old, v);
    return true; },
  del(k){ try{ localStorage.removeItem('lg.'+k);}catch(e){} }
};
const DEFAULT_PREFS = {
  eat:{kinds:['在地小吃'], price:'一般', avoid:'', high:true, alts:true},
  drink:{kinds:['咖啡'], env:['有座位能休息'], alts:true},
  play:{kinds:['自然步道','老街文化'], walk:'普通', rain:true, alts:true}
};
const DEFAULT_MEALS = [
  {k:'b', label:'早餐', time:'08:00', dur:45, on:true},
  {k:'l', label:'午餐', time:'12:00', dur:60, on:true},
  {k:'t', label:'下午茶', time:'15:00', dur:30, on:false},
  {k:'d', label:'晚餐', time:'18:00', dur:90, on:true},
  {k:'n', label:'宵夜', time:'21:00', dur:30, on:false}
];
const prefs = () => Object.assign({}, DEFAULT_PREFS, LS.get('prefs', {}));
const meals = () => LS.get('meals', DEFAULT_MEALS);
const trips = () => LS.get('trips', []);
function saveTrip(t){
  const all = trips(); const i = all.findIndex(x=>x.id===t.id);
  t.updatedAt = Date.now();
  if(i>=0) all[i]=t; else all.unshift(t);
  LS.set('trips', all);
}
function getTrip(id){
  if(id==='draft') return LS.get('draftTrip', null);
  return trips().find(t=>t.id===id) || null;
}
function putTrip(t){ if(t.id==='draft') LS.set('draftTrip', t); else saveTrip(t); }

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const WD = ['日','一','二','三','四','五','六'];
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function mdw(s){ if(!s) return ''; const d=parseYmd(s); return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'; }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function toMin(t){ const m=/^(\d{1,2}):(\d{2})/.exec(t||''); return m? (+m[1])*60+(+m[2]) : null; }
function fromMin(n){ n=((n%1440)+1440)%1440; return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
const ICON = {
  bookmark:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.5-6 4.5z"/></svg>',
  back:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pin:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  go:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  list:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8d88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }
async function copyText(s){
  try{ await navigator.clipboard.writeText(s); return true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
  }
}
function header(title, back, right=''){
  return `<header class="top">${back?`<button class="iconbtn" aria-label="返回" data-go="${esc(back)}">${ICON.back}</button>`:'<span style="width:8px"></span>'}<h1>${title}</h1>${right}</header>`;
}
/* maps links */
const gm = {
  search: (q) => 'https://www.google.com/maps/search/?api=1&query='+enc(q),
  near: (q, lat, lng) => 'https://www.google.com/maps/search/'+enc(q)+'/@'+lat+','+lng+',16z',
  dir: (dest, mode) => 'https://www.google.com/maps/dir/?api=1&destination='+enc(dest)+'&travelmode='+(mode||'driving'),
  transit: (from, to) => 'https://www.google.com/maps/dir/?api=1&origin='+enc(from)+'&destination='+enc(to)+'&travelmode=transit',
  web: (q) => 'https://www.google.com/search?q='+enc(q)
};
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const inApp = /Line\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent);

/* ================= router ================= */
const routes = {};
function go(h){ if(location.hash==='#'+h) render(); else location.hash = h; }
window.addEventListener('hashchange', render);
function render(){
  closeSheet();
  const h = location.hash.slice(1) || 'home';
  const [name, ...args] = h.split('/');
  const fn = routes[name] || routes.home;
  $('#app').innerHTML = fn(...args.map(decodeURIComponent));
  window.scrollTo(0,0);
  const after = routes[name+'_after']; if(after) after(...args.map(decodeURIComponent));
}
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  // 背景層（點外面關閉）只在點到它本身時才處理，裡面的連結要能正常打開
  if(a && a.dataset.act==='bgClose' && e.target!==a) return;
  if(a){ e.preventDefault(); const fn = ACT[a.dataset.act]; if(fn){ const r = fn(a, e); if(r && r.catch) r.catch(()=>{}); } }
});
const ACT = {};

/* ================= HOME ================= */
routes.home = () => {
  const n = trips().length;
  return `
  <div style="padding:calc(40px + env(safe-area-inset-top)) 20px 12px">
    <div style="font-size:15px;font-weight:700;color:var(--sage)">說走就走－出發吧</div>
    <h1 style="margin:6px 0 4px;font-size:30px">今天想去哪？</h1>
    <div class="sub">選一個，馬上開始</div>
  </div>
  ${inApp?`<div class="pad" style="margin-bottom:12px"><div class="note amber"><b>建議改用 Safari 打開</b><br>在 LINE／FB 裡開，存的行程可能會不見。點右下角「⋯」→「用預設瀏覽器開啟」。</div></div>`:''}
  <div class="pad stack">
    <button class="bigcard" data-go="nearby"><span class="ic" style="background:var(--terra-l);color:var(--terra)">${ICON.pin}</span><span><b>路過找吃</b><span class="d">人在外面，馬上找附近吃喝</span></span></button>
    <button class="bigcard" data-go="form"><span class="ic" style="background:var(--blue-l);color:var(--blue)">${ICON.go}</span><span><b>直接出發</b><span class="d">給一個地點，排出吃喝玩行程</span></span></button>
    <button class="bigcard" data-go="mytrips"><span class="ic" style="background:var(--sage-l);color:var(--sage)">${ICON.list}</span><span><b>我的行程</b><span class="d">${n? '存了 '+n+' 份行程' : '存過的行程會放在這裡'}</span></span></button>
    <button class="bigcard" data-go="pocket"><span class="ic" style="background:var(--amber-l,#fbf0d9);color:var(--amber,#b7791f)">${ICON.bookmark}</span><span><b>口袋名單</b><span class="d">${pocket().length? '存了 '+pocket().length+' 家，隨時排進行程' : '路上看到想去的店，貼連結存起來'}</span></span></button>
  </div>
  <div class="pad" style="margin-top:20px;display:flex;flex-direction:column;gap:4px">
    <button class="link" data-go="prefs">吃喝玩偏好</button>
    <button class="link" data-go="meals">用餐模板</button>
  </div>
  ${installHint()}
  `;
};
function installHint(){
  if(isStandalone() || !isIOS) return '';
  return `<div class="pad" style="margin-top:12px"><div class="note blue"><b>加到主畫面比較保險</b><br>Safari 7 天沒打開，存在這支手機的行程可能被清掉。按下方「分享」→「加入主畫面」，之後從圖示打開就不會。</div></div>`;
}

/* ================= NEARBY ================= */
const NEAR_CATS = ['小吃','正餐','咖啡','甜點','手搖飲','早午餐','親子餐廳','宵夜'];
let near = {lat:null,lng:null,acc:null,area:'',manual:'',state:'idle',cat:'小吃'};
routes.nearby = () => {
  const ok = near.state==='ok';
  const failed = near.state==='fail';
  const areaName = near.manual || near.area;
  let loc;
  if(near.state==='locating') loc = `<div class="note blue" role="status">定位中…第一次會問你能不能用位置，請按「允許」。</div>`;

/* 加進我的行程：選行程 → 選哪一天 */
let pickIds = [];
function pickTripFor(ids){
  pickIds = ids; const today = ymd(new Date());
  const list = trips().filter(t=>t.data.days[t.data.days.length-1].date>=today);
  const names = pocket().filter(p=>ids.includes(p.id)).map(p=>p.name);
  openSheet(`<div class="pad stack"><b style="font-size:18px">${esc(names.length>1? names.length+' 家':'「'+names[0]+'」')}加進哪份行程？</b>
    ${list.length?`<div class="card list">${list.map(t=>`<button class="rowitem" style="width:100%;border:none;border-bottom:1px solid var(--line2);background:none;text-align:left" data-act="pickTrip" data-id="${esc(t.id)}"><span style="flex:1"><b>${esc(t.title)}</b><br><span class="sub">${esc(mdw(t.data.days[0].date))}${t.data.days.length>1?' 起 '+t.data.days.length+' 天':''} · ${tripStats(t).n} 站</span></span>${ICON.chev}</button>`).join('')}</div>`:'<div class="sub">還沒有要去的行程。</div>'}
    <button class="btn2" data-act="pickTrip" data-id="new">開一份今天的新行程</button>
    <button class="link" data-act="closeSheet">取消</button></div>`);
}
ACT.pickTrip = el => {
  const id = el.dataset.id;
  if(id!=='new'){ const t=getTrip(id); if(t.data.days.length>1){
    openSheet(`<div class="pad stack"><b style="font-size:18px">加在「${esc(t.title)}」的哪一天？</b>
      <div class="card list">${t.data.days.map((d,i)=>`<button class="rowitem" style="width:100%;border:none;border-bottom:1px solid var(--line2);background:none;text-align:left" data-act="pickDay" data-id="${esc(id)}" data-i="${i}"><span style="flex:1"><b>第 ${i+1} 天</b> · ${esc(mdw(d.date))}<br><span class="sub">${d.stops.length} 站${d.stops.length?'，最後 '+esc(d.stops[d.stops.length-1].time)+' '+esc(d.stops[d.stops.length-1].name):''}</span></span>${ICON.chev}</button>`).join('')}</div>
      <button class="link" data-act="closeSheet">取消</button></div>`); return; } }
  addPocketToTrip(id, 0);
};
ACT.pickDay = el => addPocketToTrip(el.dataset.id, +el.dataset.i);
function addPocketToTrip(tripId, di){
  const items = pocket().filter(p=>pickIds.includes(p.id)); if(!items.length) return;
  const now = new Date(); let t;
  if(tripId==='new'){
    const d = ymd(now);
    t = {id:uid(), title:(shortArea(items[0].area)||near.area||near.manual||'說走就走')+' '+mdw(d), place:shortArea(items[0].area)||'', mode:'開車', span:'半天', data:{title:'', days:[{day:1, date:d, stops:[]}]}, saved:true, createdAt:Date.now()};
    t.original = {title:'', days:[{day:1,date:d,stops:[]}]};
  } else t = getTrip(tripId);
  const day = t.data.days[di] || t.data.days[0];
  // 從當天最後一站之後開始排；新行程從現在（取 15 分）開始
  let cur = day.stops.length ? toMin(day.stops[day.stops.length-1].time) + (+day.stops[day.stops.length-1].stay_min||60) : Math.ceil((now.getHours()*60+now.getMinutes())/15)*15;
  items.forEach(p=>{ day.stops.push({time:fromMin(cur), name:p.name, area:p.area, type:p.type, meal:null, stay_min:60, note:'口袋名單', open_status:'unknown', hours:'', parking:null, legs:[], alternatives:[], mapUrl:p.url}); cur += 60; });
  day.stops.sort((a,b)=>toMin(a.time)-toMin(b.time));
  saveTrip(t);
  const l = pocket(); l.forEach(p=>{ if(pickIds.includes(p.id)){ p.used = (p.used||[]).filter(u=>u.tripId!==t.id).concat([{tripId:t.id, title:t.title}]); } }); savePocket(l);
  closeSheet(); toast(items.length+' 家加進「'+t.title+'」了，時間可以到「編輯」調'); go('trip/'+t.id);
}

/* 加進團的清單 */
async function pkGroupPick(items){
  if(!API_URL || typeof loggedIn!=='function' || !loggedIn()){ toast('要先登入才能加進團'); go('login'); return; }
  window.__pkg = items;
  try{
    const d = await api('myTrips');

function nearLink(kw){
  if(near.manual) return gm.search(near.manual+' '+kw);

ACT.nearLocate = () => {
  if(!navigator.geolocation){ near.state='fail'; render(); return; }
  near.state='locating'; near.manual=''; render();
  navigator.geolocation.getCurrentPosition(async p=>{
    near.lat=p.coords.latitude; near.lng=p.coords.longitude; near.acc=p.coords.accuracy; near.state='ok'; near.area=''; render();
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${near.lat}&lon=${near.lng}&zoom=14&accept-language=zh-TW`);
      const j = await r.json(); const a = j.address||{};
      near.area = a.town || a.suburb || a.city_district || a.village || a.city || a.county || '';
      if(location.hash==='#nearby') render();
    }catch(e){}
  }, ()=>{ near.state='fail'; render(); }, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
};

  lines.push(`5. 第一站 legs 從出發點算起。${n>1?'每天最後一站排住宿（type 填 住）。':''}`);
  lines.push('');
  lines.push('回覆：只回一段 JSON，不要加任何說明文字，格式如下：');
  lines.push(SCHEMA);
  return lines.join('\n');
}

function extractJSON(text){
  let t = text.trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence) t = fence[1].trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a<0||b<a) throw new Error('找不到 JSON（回覆裡要有一段 { … } 開頭結尾的內容）');
  t = t.slice(a,b+1).replace(/[“”]/g,'"').replace(/,\s*([}\]])/g,'$1');
  try{ return JSON.parse(t); }
  catch(e){ throw new Error('JSON 格式壞掉了，可能沒複製完整（'+e.message.replace(/^JSON\.parse: /,'')+'）'); }
}
function validate(data){
  const errs=[], warns=[]; let okCount=0;
  if(!data || !Array.isArray(data.days) || !data.days.length){ errs.push({msg:'少了 days（每天的行程）'}); return {errs,warns,okCount}; }
  let idx=0;
  data.days.forEach((d,di)=>{
    if(!Array.isArray(d.stops)){ errs.push({day:di, msg:`第 ${di+1} 天沒有 stops`}); return; }
    d.stops.forEach((s,si)=>{
      idx++; const label = `第 ${data.days.length>1?(di+1)+' 天第 ':''}${si+1} 站${s&&s.name?'「'+s.name+'」':''}`;
      const probs=[];
      if(!s || typeof s!=='object'){ probs.push('不是正確的格式'); }
      else{
        if(!s.name) probs.push('少了名字');
        if(toMin(s.time)==null) probs.push('少了時間（要寫 HH:MM）');
        if(s.hours && s.hours!=='全天' && s.open_status==='open' && !/\d{1,2}:\d{2}/.test(s.hours)) warns.push(`${label}的營業時間寫成「${s.hours}」，要寫幾點到幾點`);
      }
      if(probs.length) errs.push({day:di, stop:si, msg:label+probs.join('、')}); else okCount++;
    });
  });
  return {errs,warns,okCount};
}
function normalize(data){
  data.days.forEach((d,i)=>{ d.day = d.day||i+1; d.stops = (d.stops||[]).filter(s=>s&&s.name&&toMin(s.time)!=null).map(s=>({
    ...s, time: fromMin(toMin(s.time)), type: normType(s.type, s.meal), alternatives: Array.isArray(s.alternatives)? s.alternatives.filter(a=>a&&a.name):[], legs: Array.isArray(s.legs)? s.legs.filter(Boolean):[]
  })).sort((a,b)=>toMin(a.time)-toMin(b.time)); });
  return data;
}
function normType(t, meal){ t=String(t||''); if(/吃|eat|food/i.test(t)) return '吃'; if(/喝|drink|cafe/i.test(t)) return '喝'; if(/住|stay|hotel/i.test(t)) return '住'; if(/玩|play|spot/i.test(t)) return '玩'; return meal? '吃':'玩'; }

}

  const unk = stops.filter(s=>!(s.open_status==='open' || /全天/.test(s.hours||'')) && s.open_status!=='closed').length;

function stationQ(name, mode){

  if(/台鐵|火車|區間|自強|莒光/.test(mode||'')) return /站$/.test(name)? name+' 台鐵' : name+'火車站';
  if(/高鐵/.test(mode||'')) return (/高鐵/.test(name)? name : '高鐵'+name) + (/站$/.test(name)?'':'站');
  if(/捷運|輕軌/.test(mode||'')) return (/捷運/.test(name)? name : '捷運'+name) + (/站$/.test(name)?'':'站');
  if(/公車|客運/.test(mode||'')) return name + (/站|站牌$/.test(name)? '' : ' 公車站');
  return name;
}

function splitAddrName(q){
  q = String(q||'').trim();
  const m = q.match(/^(\d{3,6})?\s*(.{0,12}?[縣市].{0,40}?(?:號|樓)(?:之\d+)?)\s*(.+)$/);
  if(m) return {name:m[3].trim(), area:m[2].trim()};
  const c = q.split(/[,，]/); if(c.length>1) return {name:c[0].trim(), area:c.slice(1).join(',').trim()};
  return {name:q, area:''};
}
function parseShared(text){
  // Google 地圖分享出來通常是「店名\n地址\nhttps://maps.app.goo.gl/…」，也可能只有連結或只有店名
  const url = (text.match(/https?:\/\/\S+/)||[])[0] || '';
  const lines = text.replace(url,'').split(/\n/).map(x=>x.trim()).filter(Boolean);
  let name = lines[0] || '';
  let area = lines[1] && !/^https?:/.test(lines[1]) ? lines[1] : '';
  if(name.includes(' · ')){ const parts=name.split(' · '); name=parts[0].trim(); area = area || parts.slice(1).join(' ').trim(); }
  if(/^[\d.]+\s*★|^★/.test(name)) name='';
  const q = url && (url.match(/[?&]q=([^&]+)/)||[])[1];
  if(!name && q){ const sp = splitAddrName(decodeURIComponent(q.replace(/\+/g,' '))); name = sp.name; area = area || sp.area; }
  const place = url && (url.match(/\/place\/([^/@?]+)/)||[])[1];
  if(!name && place) name = decodeURIComponent(place.replace(/\+/g,' '));
  return {name, area, url};
}

  const d = t.data.days[di]; t.progress = t.progress||{}; const pk = d.date;

  const now = new Date(); const nowMin = now.getHours()*60+now.getMinutes();
  if(cur==null){ cur = 0; if(!notToday){ d.stops.forEach((s,i)=>{ if(toMin(s.time)<=nowMin) cur=i; }); } }
  const s = d.stops[cur];

  <div class="foot">${cur < d.stops.length-1? `<button class="btn blue" data-act="nextStop" data-id="${esc(id)}" data-d="${esc(pk)}" data-c="${cur}">到了，換下一站</button>`:`<button class="btn blue" data-go="${tripBack(id)}">今天走完了</button>`}${cur>0?`<button class="link" data-act="prevStop" data-id="${esc(id)}" data-d="${esc(pk)}" data-c="${cur}">回上一站</button>`:''}</div>`;

ACT.editDel = el => { const d=editBuf.data.days[editBuf.day]; const s=d.stops.splice(+el.dataset.i,1)[0]; render(); toast('已刪掉「'+s.name+'」，按完成才會存'); };
ACT.editAdd = el => {
  const i=+el.dataset.i; const d=editBuf.data.days[editBuf.day]; const prev=d.stops[i];
  const t0 = prev? fromMin(toMin(prev.time)+(+prev.stay_min||60)) : '10:00';
  openSheet(`<div class="pad stack"><b style="font-size:18px">加一站</b>
    <div class="field"><label class="lbl" for="addName">店名或景點</label><input id="addName" class="inp" placeholder="要能在 Google 地圖搜到"></div>
    <div class="field"><span class="lbl">類型</span><div class="seg" id="addType" style="grid-template-columns:repeat(4,1fr)">${['吃','喝','玩','住'].map((v,k)=>`<button aria-pressed="${k===2}" data-act="addType" data-v="${v}">${v}</button>`).join('')}</div></div>
    <div class="field"><label class="lbl" for="addTime">幾點</label><input id="addTime" type="time" class="inp" value="${t0}"></div>
    <button class="btn" data-act="addDo">加進去</button><button class="link" data-act="closeSheet">取消</button></div>`);
};
ACT.addType = el => { el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===el)); };
ACT.addDo = () => {
  const name=$('#addName').value.trim(); if(!name){ toast('先打名字'); return; }
  const type = document.querySelector('#addType [aria-pressed="true"]').dataset.v;
  const d=editBuf.data.days[editBuf.day];
  const area = d.stops[0]? d.stops[0].area : '';
  d.stops.push({time:$('#addTime').value||'10:00', name, area, type, meal:null, stay_min:60, note:'自己加的', open_status:'unknown', hours:'', parking:null, legs:[], alternatives:[]});
  d.stops.sort((a,b)=>toMin(a.time)-toMin(b.time)); closeSheet(); render();
};
ACT.editSave = () => { const t=getTrip(editBuf.id); t.data=editBuf.data; putTrip(t); const id=editBuf.id; tripDay=editBuf.day; editBuf=null; toast('改好了'); go('trip/'+id); };
ACT.editRevert = () => openSheet(`<div class="pad stack"><b style="font-size:18px">還原成 AI 排的原版？</b><div class="note amber">你換過的店、改過的時間都會回到剛貼上時的樣子。</div><button class="btn" data-act="editRevert2">還原</button><button class="link" data-act="closeSheet">不要</button></div>`);
ACT.editRevert2 = () => { const t=getTrip(editBuf.id); t.data=JSON.parse(JSON.stringify(t.original)); t.progress={}; putTrip(t); const id=editBuf.id; editBuf=null; closeSheet(); toast('已還原'); go('trip/'+id); };

/* ================= SHARE / EXPORT ================= */
function tripText(t){
  const out=[t.title];
  t.data.days.forEach((d,i)=>{ out.push(''); out.push((t.data.days.length>1?'第 '+(i+1)+' 天 ':'')+mdw(d.date)); d.stops.forEach(s=>{ out.push(`${s.time} ${s.name}${s.area?'（'+s.area+'）':''}`); out.push('  '+gm.search(dest(s))); }); });
  return out.join('\n');
}
async function packTrip(t){
  const json = JSON.stringify({t:t.title, m:t.mode, d:t.data});
  if(window.CompressionStream){
    const cs = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const buf = new Uint8Array(await new Response(cs).arrayBuffer());
    let bin=''; buf.forEach(b=>bin+=String.fromCharCode(b));
    return 'z'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  return 'j'+btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpackTrip(s){
  const kind=s[0]; const b64=s.slice(1).replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(b64);
  if(kind==='z'){ const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)); const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(ds).text()); }
  return JSON.parse(decodeURIComponent(escape(bin)));
}
function icsFor(t){
  const pad=n=>String(n).padStart(2,'0');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//letsgo//zh-TW','CALSCALE:GREGORIAN'];
  const escI = s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  t.data.days.forEach(d=>d.stops.forEach((s,i)=>{
    const st=toMin(s.time); const next=d.stops[i+1]; let en = st + (+s.stay_min||60); if(next && toMin(next.time)>st) en=Math.min(en, toMin(next.time)); if(en<=st) en=st+30;
    const day=d.date.replace(/-/g,'');
    const dt = m=>day+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';
    L.push('BEGIN:VEVENT','UID:'+t.id+'-'+d.date+'-'+i+'@letsgo','DTSTAMP:'+stamp,'DTSTART;TZID=Asia/Taipei:'+dt(st),'DTEND;TZID=Asia/Taipei:'+dt(Math.min(en,1439)),
      'SUMMARY:'+escI((s.meal&&s.meal!=='null'?s.meal+'：':'')+s.name),'LOCATION:'+escI(dest(s)),'DESCRIPTION:'+escI([s.note, s.parking?'停車：'+s.parking:'', gm.search(dest(s))].filter(Boolean).join('\n')),'END:VEVENT');
  }));
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
routes.share = (id) => {
  const t=getTrip(id); if(!t) return routes.trip(id);
  return header('分享與匯出',tripBack(id)) + `<div class="pad stack">
    <div class="sub">${esc(t.title)}</div>
    <section class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><b style="font-size:17px">唯讀分享連結</b><span class="hint">行程整份放在連結裡，拿到的人不用裝、不用登入就能看，不能改。改了行程要重新分享。</span>
      <div style="display:flex;gap:8px"><button class="btn2" style="flex:1" data-act="shareLink" data-id="${esc(id)}">分享到 LINE…</button><button class="btn2" style="flex:1" data-act="copyLink" data-id="${esc(id)}">複製連結</button></div></section>
    <section class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><b style="font-size:17px">加到手機行事曆</b><span class="hint">每一站變成一個行程，含地址和地圖連結（.ics 檔）</span><button class="btn2" data-act="ics" data-id="${esc(id)}">下載行事曆檔</button></section>
    <section class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><b style="font-size:17px">複製成文字</b><span class="hint">時間＋站名＋地圖連結，貼到記事本或群組</span><button class="btn2" data-act="copyTxt" data-id="${esc(id)}">複製文字</button></section>
  </div>`;
};
async function shareUrl(id){ const t=getTrip(id); return location.origin+location.pathname+'#view/'+await packTrip(t); }
ACT.shareLink = async el => { const url=await shareUrl(el.dataset.id); const t=getTrip(el.dataset.id);
  if(navigator.share){ try{ await navigator.share({title:t.title, text:t.title+'（行程）', url}); }catch(e){} }
  else location.href='https://line.me/R/msg/text/?'+enc(t.title+' '+url); };
ACT.copyLink = async el => { const ok=await copyText(await shareUrl(el.dataset.id)); toast(ok?'連結已複製':'複製失敗'); };
ACT.copyTxt = async el => { const ok=await copyText(tripText(getTrip(el.dataset.id))); toast(ok?'已複製':'複製失敗'); };
ACT.ics = el => { const t=getTrip(el.dataset.id); const blob=new Blob([icsFor(t)],{type:'text/calendar'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(t.title||'trip')+'.ics'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); };

/* read-only view */
let viewCache = null;
routes.view = (packed) => {
  if(!viewCache || viewCache.key!==packed){
    viewCache = {key:packed, t:null};
    unpackTrip(packed).then(o=>{ viewCache.t={id:'view', title:o.t, mode:o.m, data:o.d, saved:true}; render(); }).catch(()=>{ viewCache.t='bad'; render(); });
    return header('讀取中…','home')+'<div class="pad"><div class="note blue">正在打開分享的行程…</div></div>';
  }
  if(viewCache.t==='bad') return header('打不開','home')+'<div class="pad"><div class="note terra">這個連結不完整，請對方重新分享。</div></div>';
  const t=viewCache.t;
  if(tripDay>=t.data.days.length) tripDay=0;
  const d=t.data.days[tripDay];
  return header(esc(t.title),'home') + `<div class="pad stack"><div class="note blue">這是別人分享的唯讀行程。想留著自己用，按下面「存到我的行程」。</div></div>
    ${t.data.days.length>1?`<div class="tabs" style="margin-top:12px">${t.data.days.map((dd,i)=>`<button aria-selected="${i===tripDay}" data-act="day" data-i="${i}">第 ${i+1} 天 · ${esc(mdw(dd.date))}</button>`).join('')}</div>`:'<div style="height:12px"></div>'}
    <div class="stack" style="padding:0 16px 16px 8px">${d.stops.map((_,si)=>stopHTML(t,tripDay,si,{noswap:true})).join('')}</div>
    <div class="foot"><button class="btn" data-act="saveView">存到我的行程</button></div>`;
};
ACT.saveView = () => { const v=viewCache.t; const t={id:uid(), title:v.title, place:v.title, mode:v.mode, data:v.data, original:JSON.parse(JSON.stringify(v.data)), saved:true, createdAt:Date.now()}; saveTrip(t); toast('存好了'); go('trip/'+t.id); };

if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
